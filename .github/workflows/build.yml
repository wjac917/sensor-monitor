name: Build Windows EXE

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pymodbus pyserial matplotlib numpy PyInstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name DisplacementSensorMonitor sensor_monitor_v2.py

      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DisplacementSensorMonitor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplacementSensorMonitor-Windows
          path: dist/DisplacementSensorMonitor.exe
